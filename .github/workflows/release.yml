name: Build & Publish Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-linux:
    name: Build macOS DMG & Linux Tarball & Fat JAR
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Fat JAR with Maven
        run: mvn clean package -DskipTests

      - name: Create macOS App & Drag-and-Drop DMG Installer
        run: |
          APP_DIR="PostgreSQL DDL Studio.app"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          
          # Copy icon and JAR
          cp src/main/resources/AppIcon.icns "$APP_DIR/Contents/Resources/AppIcon.icns"
          cp target/postgres_ddl_export_console_java-1.0.0.jar "$APP_DIR/Contents/MacOS/app.jar"
          
          # Use smart launcher script
          cp scripts/macos/launcher "$APP_DIR/Contents/MacOS/launcher"
          chmod 755 "$APP_DIR/Contents/MacOS/launcher"
          
          # Info.plist
          cat << 'EOF' > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>PostgreSQL DDL Studio</string>
              <key>CFBundleDisplayName</key>
              <string>PostgreSQL DDL Studio</string>
              <key>CFBundleIdentifier</key>
              <string>com.ddlexporter.app</string>
              <key>CFBundleVersion</key>
              <string>5.5.7</string>
              <key>CFBundleShortVersionString</key>
              <string>5.5.7</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>launcher</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>NSHumanReadableCopyright</key>
              <string>Copyright © 2026 Devran Sever. All rights reserved.</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          EOF

          # Clean extended attributes and sign ad-hoc
          xattr -cr "$APP_DIR" 2>/dev/null || true
          codesign --force --deep --sign - "$APP_DIR" 2>/dev/null || true
          chmod +x scripts/macos/Guvenlik_Iznini_Ver.command
      - name: Build Professional Drag-and-Drop DMG Installer
        run: |
          brew install create-dmg dpkg || true
          OUTPUT_DMG="PostgreSQL-DDL-Studio-5.6.0-macOS.dmg"
          rm -f "$OUTPUT_DMG"
          
          create-dmg \
            --volname "PostgreSQL DDL Studio" \
            --volicon "src/main/resources/AppIcon.icns" \
            --background "scripts/macos/dmg_bg.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 110 \
            --icon "PostgreSQL DDL Studio.app" 150 180 \
            --hide-extension "PostgreSQL DDL Studio.app" \
            --app-drop-link 450 180 \
            "$OUTPUT_DMG" \
            "PostgreSQL DDL Studio.app" || {
              STAGING="dmg_staging"
              mkdir -p "$STAGING"
              cp -R "PostgreSQL DDL Studio.app" "$STAGING/"
              cp "scripts/macos/Guvenlik_Iznini_Ver.command" "$STAGING/İlk Açılışta Güvenlik İzni Ver.command"
              chmod 755 "$STAGING/İlk Açılışta Güvenlik İzni Ver.command"
              ln -s /Applications "$STAGING/Applications"
              hdiutil create -volname "PostgreSQL DDL Studio" -srcfolder "$STAGING" -ov -format UDZO "$OUTPUT_DMG"
              rm -rf "$STAGING"
            }

      - name: Create Windows Portable ZIP
        run: |
          WIN_DIR="PostgreSQL-DDL-Studio-Windows"
          mkdir -p "$WIN_DIR"
          cp target/postgres_ddl_export_console_java-1.0.0.jar "$WIN_DIR/PostgreSQL-DDL-Studio.jar"
          cp scripts/windows/PostgreSQL-DDL-Studio.bat "$WIN_DIR/"
          cp scripts/windows/PostgreSQL-DDL-Studio.vbs "$WIN_DIR/"
          cp scripts/windows/README-Windows.txt "$WIN_DIR/"
          cp src/main/resources/AppIcon.ico "$WIN_DIR/"
          zip -r "PostgreSQL-DDL-Studio-5.6.0-Windows.zip" "$WIN_DIR"
          rm -rf "$WIN_DIR"

      - name: Create Linux Portable Tarball & Debian Package
        run: |
          LINUX_DIR="PostgreSQL-DDL-Studio-Linux"
          mkdir -p "$LINUX_DIR"
          cp target/postgres_ddl_export_console_java-1.0.0.jar "$LINUX_DIR/PostgreSQL-DDL-Studio.jar"
          cp scripts/linux/run.sh "$LINUX_DIR/run.sh"
          cp scripts/linux/install.sh "$LINUX_DIR/install.sh"
          cp scripts/linux/postgres-ddl-studio.desktop "$LINUX_DIR/"
          cp src/main/resources/app_icon.png "$LINUX_DIR/"
          
          cat << 'EOF' > "$LINUX_DIR/README-Linux.txt"
          ========================================================================
            Linux Portable Edition
          ========================================================================

          Gereksinimler:
          - Kali Linux, Ubuntu 20.04+, Debian 11+, Fedora 36+, Arch Linux vb.
          - Java 17+ (Kali / Debian / Ubuntu: sudo apt install -y openjdk-17-jre)

          Kolay Kurulum (Masaüstü & Menü Entegrasyonu):
          1. ./install.sh
             (Uygulamayı otomatik olarak Kali / Linux sistem menüsüne ekler)

          Doğrudan Başlatma:
          1. chmod +x run.sh
             ./run.sh

          2. Doğrudan Java ile:
             java -jar PostgreSQL-DDL-Studio.jar
          ========================================================================
          EOF
          chmod +x "$LINUX_DIR/run.sh" "$LINUX_DIR/install.sh"
          tar -czf "PostgreSQL-DDL-Studio-5.6.0-Linux.tar.gz" "$LINUX_DIR"
          rm -rf "$LINUX_DIR"

          # Build .deb Package if dpkg-deb is available
          /bin/bash scripts/linux/build_deb.sh || true

      - name: Save Unix Artifacts
        run: |
          cp target/postgres_ddl_export_console_java-1.0.0.jar PostgreSQL-DDL-Studio.jar
        shell: bash

      - name: Upload Unix Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unix-artifacts
          path: |
            *.dmg
            *.zip
            *.tar.gz
            *.deb
            PostgreSQL-DDL-Studio.jar
            target/postgres_ddl_export_console_java-1.0.0.jar

  build-windows-exe:
    name: Build Windows Native EXE Setup Wizard
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Fat JAR with Maven
        shell: cmd
        run: mvn clean package -DskipTests

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile Windows EXE Setup Wizard
        shell: cmd
        run: |
          mkdir dist
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\windows\setup.iss
          dir dist\*.exe

      - name: Save Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-artifact
          path: dist/*.exe

  publish-release:
    name: Publish Release to GitHub
    needs: [build-macos-linux, build-windows-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw_artifacts/

      - name: Flatten Artifacts & Generate SHA-256 Checksums
        run: |
          mkdir -p release_assets
          find raw_artifacts/ -type f -exec cp {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS.txt || true
          ls -lh
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "PostgreSQL DDL Studio ${{ github.ref_name }} (Cross-Platform Multi-OS Edition)"
          body: |
            ## PostgreSQL DDL Studio ${{ github.ref_name }} Yayında!
            
            PostgreSQL DDL Studio artık **Windows** üzerinde tamamen sessiz (0 CMD Penceresi) çalışan modern başlatıcı ve arka plan güncelleyici ile güncellendi!
            
            ### Öne Çıkan Özellikler:
            - **Sıfır CMD Penceresi (Windows):** Uygulama açılırken ve canlı güncelleme uygulanırken hiçbir siyah terminal penceresi açılmaz; tamamen pürüzsüz yerel masaüstü deneyimi sunar.
            - **Görsel Tablo Tasarımcısı & Sihirbazı:** Kolon ekleme/çıkarma, ComboBox ile veri tipi seçimi, PK/FK/Constraint yönetimi, hazır şablonlar (Kullanıcı, Ürün, Sipariş, Log) ve canlı SQL DDL önizlemesi.
            - **Otomatik Şema & ERD Entegrasyonu:** Oluşturulan tablo anında diske kaydedilir, Nesne Ağacına ve İlişki Haritasına (ERD) dinamik kart olarak eklenir.
            - **Evrensel Veritabanı & Docker Asistanı:** Docker konteynerlerini otomatik algılama, tek tıkla yeni demo PostgreSQL başlatma, Neon / Supabase / AWS RDS bağlantı dizelerini (URI) otomatik çözme ve test şeması yükleme (Seed Data).
            - **Windows Native Kurulum Sihirbazı:** Kurulum dizini seçimi, Masaüstü ve Başlat Menüsü simgeleri, otomatik kaldırma aracı (Uninstaller) içeren modern `.exe` Setup.
            - **İnteraktif Şema Gezgini:** Hiyerarşik ağaç, anında düzenleme, SQL formatlama ve tek tıkla ZIP arşivleme.
            - **Görsel ERD Haritası:** Panning, zooming (%20-%300), sürüklenebilir tablo kartları, Bézier ilişkileri, Mermaid ve PNG dışa aktarma.
            - **Canlı Ortam Karşılaştırma (Diff):** Staging vs Production fark tespiti, otomatik dağıtım yaması (Deploy Patch) üretimi ve veri kaybı koruması.
            - **Canlı Sunucu Durumu & Performans:** Bağlantı havuzu, toplam boyut, önbellek verimliliği (%99+), Java2D grafikleri ve sistem teşhisi.
            - **Otomatik Zamanlanmış Yedekleme (Cron):** Arka planda sessiz DDL yedekleme, otomatik Git commit ve durdurma/başlatma kontrolü.
            - **Kurumsal Güvenlik Kalkanı:** AES-256 GCM parola şifreleme, Git sızıntı kalkanı ve AppPathHelper güvenli yapılandırma saklama.
            
            ---
            ### İndirme Paketleri (Binary Assets):
            - **Windows (.exe Kurulum Sihirbazı):** `PostgreSQL-DDL-Studio-Setup-5.6.0.exe` *(Önerilen)*
            - **macOS (.dmg Yükleyici):** `PostgreSQL-DDL-Studio-5.6.0-macOS.dmg`
            - **Linux (.deb Kurulum Paketi - Kali/Debian/Ubuntu):** `PostgreSQL-DDL-Studio-5.6.0-Linux.deb`
            - **Linux Portable (.tar.gz):** `PostgreSQL-DDL-Studio-5.6.0-Linux.tar.gz`
            - **Windows Portable (.zip):** `PostgreSQL-DDL-Studio-5.6.0-Windows.zip`
            - **Evrensel JAR (Tüm Sistemler & CLI):** `PostgreSQL-DDL-Studio.jar`
            - **Güvenlik Doğrulama:** `SHA256SUMS.txt`
          files: release_assets/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
