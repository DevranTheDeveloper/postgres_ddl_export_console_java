name: Windows Automated CI & Installer Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-windows:
    name: Build Windows EXE Installer & Verify
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Verify Windows Environment & Java
        shell: cmd
        run: |
          echo "=== 🪟 WINDOWS ORTAMI BILGISI ==="
          ver
          java -version

      - name: Compile Fat JAR on Windows
        shell: cmd
        run: |
          echo "=== 🔨 WINDOWS UZERINDE MAVEN DERLEMESI ==="
          mvn clean package -DskipTests

      - name: Verify Windows FAT JAR and Output
        shell: cmd
        run: |
          echo "=== 🧪 WINDOWS JAR TESTI ==="
          dir target\*.jar
          java -jar target\postgres_ddl_export_console_java-1.0.0.jar -help

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Compile Windows EXE Setup Wizard
        shell: cmd
        run: |
          mkdir dist
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\windows\setup.iss
          dir dist\*.exe

      - name: Upload Windows Setup EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostgreSQL-DDL-Studio-Setup-Windows
          path: dist/*.exe
