name: Windows Automated CI & Compatibility Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-windows:
    name: Verify on Windows 2022 / Windows 11 Runner
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Verify Windows Environment & Java
        shell: cmd
        run: |
          echo "=== 🪟 WINDOWS ORTAMI BILGISI ==="
          ver
          java -version

      - name: Compile and Test on Windows
        shell: cmd
        run: |
          echo "=== 🔨 WINDOWS UZERINDE MAVEN DERLEMESI ==="
          mvn clean package -DskipTests

      - name: Verify Windows FAT JAR and Output Directory
        shell: cmd
        run: |
          echo "=== 🧪 WINDOWS JAR TESTI ==="
          dir target\*.jar
          java -jar target\postgres_ddl_export_console_java-1.0.0.jar -help

      - name: Verify Windows Packaging Files
        shell: cmd
        run: |
          if not exist "scripts\windows\PostgreSQL-DDL-Studio.bat" exit /b 1
          if not exist "scripts\windows\PostgreSQL-DDL-Studio.vbs" exit /b 1
          if not exist "src\main\resources\AppIcon.ico" exit /b 1
          echo "✅ Windows dosyalari ve uyumlulugu eksiksiz dogrulandi!"
